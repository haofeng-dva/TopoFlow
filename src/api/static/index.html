<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TopoFlow · 3D 资产自动处理与质量控制系统</title>
<style>
  @font-face {
    font-family: 'Space Mono';
    src: url('./vendor/fonts/SpaceMono-Regular.ttf') format('truetype');
    font-weight: 400; font-display: swap;
  }
  @font-face {
    font-family: 'Space Mono';
    src: url('./vendor/fonts/SpaceMono-Bold.ttf') format('truetype');
    font-weight: 700; font-display: swap;
  }
  :root {
    --bg: #0A0A0A;
    --card: rgba(20, 20, 20, 0.90);
    --card-2: rgba(26, 26, 26, 0.90);
    --line: #262626;
    --line-2: #333333;
    --ink: #F4F4F5;
    --ink-2: #A1A1AA;
    --ink-3: #71717A;
    --gold: #F2B146;
    --gold-dim: #B45309;
    --ok: #34D399;
    --warn: #FB923C;
    --bad: #F87171;
    --mono: 'Space Mono', 'Cascadia Mono', Consolas, monospace;
    --sans: 'Microsoft YaHei', 'PingFang SC', 'Segoe UI', system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg); color: var(--ink); font-size: 14px;
    display: flex; flex-direction: column;
  }

  /* ---------- 顶栏 ---------- */
  header {
    background: #050505; color: #fff; height: 60px;
    display: flex; align-items: center; gap: 14px; padding: 0 26px;
    border-bottom: 1px solid var(--line);
  }
  .px-logo { display: flex; gap: 3px; align-items: flex-end; }
  .px-logo i { width: 7px; height: 7px; background: var(--gold); display: block; }
  .px-logo i:nth-child(2) { height: 11px; opacity: .75; }
  .px-logo i:nth-child(3) { height: 15px; opacity: .45; }
  header .logo { font-family: var(--mono); font-size: 21px; font-weight: 700; letter-spacing: .5px; }
  header .sub { font-size: 12px; color: var(--ink-3); border-left: 1px solid var(--line-2); padding-left: 14px; }
  header .tools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .tool-badge {
    border: 1px solid var(--line-2); border-radius: 3px;
    padding: 3px 10px; font-size: 11px; font-family: var(--mono);
    display: flex; align-items: center; gap: 6px; color: var(--ink-2);
  }
  .tool-badge .dot { width: 6px; height: 6px; background: #3F3F46; }
  .tool-badge.on { color: var(--ink); border-color: var(--gold-dim); }
  .tool-badge.on .dot { background: var(--gold); }

  /* ---------- 主布局（第二屏：工作台） ---------- */
  main {
    display: flex; gap: 18px; padding: 20px 26px; overflow: hidden;
    height: calc(100vh - 60px); min-height: 600px;
    position: relative;
  }
  /* 流动光背景（移植自 grampixel 成员区 neuro-bg） */
  main .neuro-bg-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    z-index: 0; pointer-events: none;
  }
  /* 走描线纹理（grampixel 成员区同款扫描线） */
  main::after {
    content: ""; position: absolute; top: 0; left: 0; height: 100%; width: 100%;
    background-image: repeating-linear-gradient(transparent, transparent 2px, rgba(255,255,255,0.05) 4px);
    pointer-events: none; z-index: 1;
  }
  #left { width: 356px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; position: relative; z-index: 2; }
  #right { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; z-index: 2; }

  /* ---------- Hero 光环区（移植自 grampixel.jp，tint 改品牌金） ---------- */
  .hero {
    position: relative; width: 100%; height: calc(100vh - 60px); min-height: 560px;
    background: #000; display: flex; align-items: center; justify-content: center;
    overflow: hidden; border-bottom: 1px solid var(--line);
  }
  .hero-reflect-wrap {
    position: absolute; top: 50%; left: 50%;
    width: 100%; height: 100%; min-width: 1200px; min-height: 800px;
    transform: translate(-50%, -50%); overflow: hidden; background: #020202;
  }
  .hero-reflect-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .hero-content { position: relative; z-index: 10; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .hero-title {
    font-family: var(--mono); font-size: 54px; font-weight: 700; letter-spacing: .35em;
    color: var(--ink); padding-left: .35em; user-select: none; line-height: 1; margin: 0;
  }
  .hero-title .char { display: inline-block; opacity: 0; }
  .hero-subtitle {
    font-family: var(--mono); font-size: 13px; font-weight: 400; letter-spacing: .3em;
    color: var(--gold); padding-left: .3em; margin: 0; user-select: none;
    opacity: 0; transform: translate(-3px, 5px) scale(.92);
    animation: blurFadeIn 1.2s cubic-bezier(.25,.46,.45,.94) 1.6s forwards;
  }
  .hero-meta {
    font-size: 12px; letter-spacing: .2em; color: var(--ink-3); padding-left: .2em; margin: 0;
    opacity: 0; transform: translate(-3px, 5px) scale(.92);
    animation: blurFadeIn 1.2s cubic-bezier(.25,.46,.45,.94) 2.2s forwards;
  }
  .hero-scroll-hint {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 10;
    opacity: 0; animation: fadeInHint 1s ease 2.8s forwards;
  }
  .hero-scroll-hint span { font-size: 9px; letter-spacing: .25em; color: var(--ink-3); font-family: var(--mono); }
  .scroll-line {
    width: 1px; height: 40px;
    background: linear-gradient(to bottom, var(--gold-dim), transparent);
    animation: scrollPulse 2s ease-in-out infinite;
  }
  @keyframes charFlickA {
    0%{opacity:0}12%{opacity:1}18%{opacity:0}34%{opacity:1}40%{opacity:0}
    60%{opacity:1}66%{opacity:0}80%{opacity:1}100%{opacity:1}
  }
  @keyframes charFlickB {
    0%{opacity:0}20%{opacity:1}26%{opacity:0}30%{opacity:1}50%{opacity:0}
    70%{opacity:1}74%{opacity:.2}88%{opacity:1}100%{opacity:1}
  }
  @keyframes charFlickC {
    0%{opacity:0}8%{opacity:1}14%{opacity:0}22%{opacity:1}28%{opacity:0}
    38%{opacity:1}55%{opacity:0}62%{opacity:1}72%{opacity:0}82%{opacity:1}100%{opacity:1}
  }
  @keyframes blurFadeIn { to { opacity: 1; transform: translate(0, 0) scale(1); } }
  @keyframes fadeInHint { to { opacity: 1; } }
  @keyframes scrollPulse {
    0%, 100% { transform: scaleY(1); opacity: .4; }
    50%       { transform: scaleY(1.3); opacity: .9; }
  }
  .card { background: var(--card); border: 1px solid var(--line); padding: 20px; }
  .card h2 {
    font-size: 14px; font-weight: 600; margin-bottom: 14px; color: var(--ink);
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono); letter-spacing: 1px;
  }
  .card h2 .no { color: var(--gold); font-weight: 700; }
  .card h2 .zh { font-family: var(--sans); letter-spacing: 0; }

  /* 上传区 */
  .dropzone {
    border: 1px dashed var(--line-2); padding: 30px 14px; text-align: center; cursor: pointer;
    transition: border-color .18s, background .18s;
  }
  .dropzone:hover, .dropzone.drag { border-color: var(--gold); background: #1A1408; }
  .dropzone .icon { font-family: var(--mono); font-size: 26px; color: var(--gold); line-height: 1; margin-bottom: 10px; }
  .dropzone .tip { color: var(--ink-3); font-size: 11px; margin-top: 6px; font-family: var(--mono); }
  .dropzone .name { margin-top: 8px; font-size: 13px; color: var(--gold); font-weight: 600; word-break: break-all; font-family: var(--mono); }

  label.fld { display: block; font-size: 11px; color: var(--ink-3); margin: 14px 0 5px; letter-spacing: 1px; }
  select {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line-2); background: var(--card-2);
    border-radius: 0; font-size: 13px; color: var(--ink); outline: none;
  }
  select:focus { border-color: var(--gold); }
  select option { background: #111; }

  .check-row { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 12px; color: var(--ink-2); cursor: pointer; }
  .check-row input { accent-color: var(--gold); width: 14px; height: 14px; }

  button {
    border: none; cursor: pointer; font-size: 13px; padding: 10px 16px;
    font-family: var(--mono); letter-spacing: 1px; transition: all .15s;
  }
  .btn-primary { background: var(--gold); color: #0A0A0A; width: 100%; margin-top: 18px; font-weight: 700; padding: 12px; }
  .btn-primary:hover { background: #FFC961; }
  .btn-primary:disabled { background: #3F3F46; color: #71717A; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--ink-2); width: 100%; margin-top: 10px; border: 1px solid var(--line-2); }
  .btn-ghost:hover { border-color: var(--gold-dim); color: var(--ink); }

  /* ---------- 任务列表 ---------- */
  #tasklist { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; }
  .task { background: var(--card); border: 1px solid var(--line); overflow: hidden; transition: border-color .15s; }
  .task.sel { border-color: var(--gold-dim); }
  .task-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; cursor: pointer; user-select: none; }
  .task-head .no { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
  .task.sel .task-head .no { color: var(--gold); }
  .task-head .fname { font-weight: 600; font-size: 14px; flex: 1; word-break: break-all; }
  .task-head .time { font-size: 11px; color: var(--ink-3); font-family: var(--mono); }
  .task-head .arrow { color: var(--ink-3); font-size: 10px; transition: transform .15s; }
  .task.open .arrow { transform: rotate(90deg); color: var(--gold); }

  .status { font-size: 11px; padding: 3px 10px; white-space: nowrap; font-family: var(--mono); letter-spacing: .5px; }
  .status.queued, .status.interrupted { background: #1C1C1C; color: var(--ink-3); border: 1px solid var(--line); }
  .status.running { background: #1A1408; color: var(--gold); border: 1px solid var(--gold-dim); }
  .status.passed { background: #0E1F16; color: var(--ok); border: 1px solid #14532D; }
  .status.quality_failed { background: #211408; color: var(--warn); border: 1px solid #7C3A0E; }
  .status.failed, .status.cancelled { background: #1F0E0D; color: var(--bad); border: 1px solid #7F1D1D; }

  .progress-wrap { height: 3px; background: #1C1C1C; overflow: hidden; margin: 0 18px 13px; }
  .progress-bar { height: 100%; background: var(--gold); width: 0%; transition: width .5s; }

  .task-body { display: none; padding: 4px 18px 20px; }
  .task.open .task-body { display: block; }

  /* Gate 卡片 */
  .gates { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
  .gate { border: 1px solid var(--line); padding: 13px; background: var(--card-2); }
  .gate.pass { border-color: #14532D; }
  .gate.fail { border-color: #7F1D1D; }
  .gate .g-title { font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 7px; font-family: var(--mono); }
  .gate .g-title .mark { width: 8px; height: 8px; background: #3F3F46; }
  .gate.pass .g-title .mark { background: var(--ok); }
  .gate.fail .g-title .mark { background: var(--bad); }
  .gate .g-state { font-size: 10px; padding: 2px 7px; margin-left: auto; font-family: var(--mono); }
  .gate.pass .g-state { color: var(--ok); }
  .gate.fail .g-state { color: var(--bad); }
  .gate.skip .g-state { color: var(--ink-3); }
  .gate .g-pts { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
  .gate .g-pts .kv { display: flex; justify-content: space-between; font-size: 11px; }
  .gate .g-pts .kv b { color: var(--ink-3); font-weight: 400; }
  .gate .g-pts .kv span { color: var(--ink); font-family: var(--mono); font-size: 11px; }

  /* 结果横幅 */
  .banner { padding: 13px 16px; margin-top: 10px; font-size: 13px; display: flex; align-items: center; gap: 10px; border: 1px solid; }
  .banner.ok { background: #0E1F16; color: var(--ok); border-color: #14532D; }
  .banner.warn { background: #211408; color: var(--warn); border-color: #7C3A0E; }
  .banner.bad { background: #1F0E0D; color: var(--bad); border-color: #7F1D1D; }
  .banner .dur { margin-left: auto; font-family: var(--mono); font-weight: 700; font-size: 15px; }

  /* TopoStrain 大数字 */
  .ts-row { display: flex; align-items: center; gap: 20px; margin-top: 14px; padding: 14px 18px; background: var(--card-2); border: 1px solid var(--line); }
  .ts-num { font-family: var(--mono); font-size: 38px; font-weight: 700; line-height: 1; }
  .ts-num.good { color: var(--ok); } .ts-num.mid { color: var(--gold); } .ts-num.bad { color: var(--bad); }
  .ts-desc { font-size: 11px; color: var(--ink-2); line-height: 1.6; }
  .ts-desc b { color: var(--ink); }

  /* 3D 查看器 */
  .viewer-wrap { margin-top: 12px; border: 1px solid var(--line); overflow: hidden; }
  .viewer-bar {
    display: flex; align-items: center; padding: 9px 13px; background: #0F0F0F;
    font-size: 11px; color: var(--ink-2); gap: 8px; font-family: var(--mono); letter-spacing: .5px;
    border-bottom: 1px solid var(--line);
  }
  .viewer-bar .tag { color: var(--gold); font-weight: 700; }
  .viewer-bar .hint { margin-left: auto; color: var(--ink-3); }
  #viewer { width: 100%; height: 340px; display: block; }

  /* 产物 */
  .files-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .thumb { width: 110px; text-align: center; }
  .thumb img { width: 110px; height: 110px; object-fit: contain; background: #0F0F0F; border: 1px solid var(--line); }
  .thumb .t { font-size: 10px; color: var(--ink-3); margin-top: 4px; word-break: break-all; font-family: var(--mono); }
  .dl-list { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
  .dl-list a {
    font-size: 11px; color: var(--gold); text-decoration: none; font-family: var(--mono);
    background: #1A1408; border: 1px solid var(--gold-dim); padding: 5px 10px;
  }
  .dl-list a:hover { background: #2A1F0A; }

  .kv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 7px 18px; margin-top: 10px; }
  .kv-grid .kv2 { font-size: 11px; display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line); padding-bottom: 4px; }
  .kv-grid .kv2 b { color: var(--ink-3); font-weight: 400; }
  .kv-grid .kv2 span { font-family: var(--mono); font-weight: 400; }

  .empty { color: var(--ink-3); text-align: center; padding: 60px 0; font-size: 12px; font-family: var(--mono); }
  .err-text { margin-top: 10px; background: #1F0E0D; color: var(--bad); padding: 10px 12px; font-size: 12px; word-break: break-all; border: 1px solid #7F1D1D; }

  /* toast */
  #toast {
    position: fixed; top: 72px; left: 50%; transform: translateX(-50%) translateY(-16px);
    background: #050505; color: var(--gold); border: 1px solid var(--gold-dim);
    padding: 10px 24px; font-size: 12px; font-family: var(--mono);
    opacity: 0; pointer-events: none; transition: all .25s; z-index: 99;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar { width: 9px; }
  ::-webkit-scrollbar-track { background: #0A0A0A; }
  ::-webkit-scrollbar-thumb { background: #2E2E2E; }
  ::-webkit-scrollbar-thumb:hover { background: #3F3F46; }
</style>
</head>
<body>

<header>
  <div class="px-logo"><i></i><i></i><i></i></div>
  <div class="logo">TopoFlow</div>
  <div class="sub">3D 资产自动处理与质量控制系统</div>
  <div class="tools" id="tools"></div>
</header>

<section class="hero" id="heroTop">
  <div class="hero-reflect-wrap" id="heroReflectWrap">
    <canvas id="heroReflect" class="hero-reflect-canvas" aria-hidden="true"></canvas>
  </div>
  <div class="hero-content">
    <h1 class="hero-title" id="heroTitle">TOPOFLOW</h1>
    <p class="hero-subtitle">3D GAME ASSET PIPELINE / QUALITY GATE SYSTEM</p>
    <p class="hero-meta">十阶段管线 · 四重质量门禁 · LANGGRAPH ORCHESTRATION · V0.9.0</p>
  </div>
  <div class="hero-scroll-hint"><span>console</span><div class="scroll-line"></div></div>
</section>

<main id="consoleSection">
  <canvas class="neuro-bg-canvas" aria-hidden="true"></canvas>
  <div id="left">
    <div class="card">
      <h2><span class="no">01</span><span class="zh">提交处理任务</span></h2>
      <div class="dropzone" id="dropzone">
        <div class="icon">[ + ]</div>
        <div>拖拽模型到此处，或点击选择文件</div>
        <div class="tip">.obj / .ply / .stl / .glb / .gltf / .fbx</div>
        <div class="name" id="fname"></div>
      </div>
      <input type="file" id="file" accept=".obj,.ply,.stl,.glb,.gltf,.fbx" hidden />
      <label class="fld">引擎预设 / PRESET</label>
      <select id="preset">
        <option value="tuanjie_urp">团结引擎 URP（默认）</option>
        <option value="tuanjie">团结引擎</option>
        <option value="unity_urp">Unity URP</option>
        <option value="unity">Unity</option>
        <option value="unity_hdrp">Unity HDRP</option>
        <option value="ue5_nanite">UE5 Nanite</option>
        <option value="mobile">移动端</option>
      </select>
      <label class="fld">重拓扑后端 / RETOPO</label>
      <select id="retopo">
        <option value="">自动</option>
        <option value="meshlab">MeshLab</option>
        <option value="instant_meshes">Instant Meshes</option>
        <option value="blender_remesh">Blender Remesh</option>
        <option value="quadremesher">QuadRemesher</option>
      </select>
      <label class="check-row">
        <input type="checkbox" id="full" />
        运行完整 Stage 1–10（含烘焙与引擎验证，耗时更长）
      </label>
      <button class="btn-primary" id="submitBtn" disabled>&gt; 开始处理</button>
      <button class="btn-ghost" id="validateBtn" disabled>&gt; 快速质检（Gate A）</button>
    </div>

    <div class="card" id="inspectCard" style="display:none">
      <h2><span class="no">02</span><span class="zh">快速质检结果</span></h2>
      <div id="inspectBody"></div>
    </div>
  </div>

  <div id="right">
    <div class="card" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
      <h2><span class="no">03</span><span class="zh">任务队列</span><span style="font-weight:400;color:var(--ink-3);font-size:11px;font-family:var(--mono);" id="count"></span></h2>
      <div id="tasklist"><div class="empty">// 暂无任务，从左侧提交一个模型开始</div></div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OBJLoader } from './vendor/addons/loaders/OBJLoader.js';
import { OrbitControls } from './vendor/addons/controls/OrbitControls.js';

/* ================= 基础工具 ================= */
const $ = (s) => document.querySelector(s);
let toastTimer = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const STATUS_ZH = {
  queued: '排队中', running: '运行中', passed: 'PASSED',
  quality_failed: 'QUALITY_FAIL', failed: 'FAILED', cancelled: '已取消', interrupted: '已中断',
};
const GATES = [
  ['gate_a_topology', 'Gate A · 拓扑'],
  ['gate_b_uv', 'Gate B · UV'],
  ['gate_c_bake', 'Gate C · 烘焙'],
  ['gate_d_engine_import', 'Gate D · 引擎'],
];
const M_LABEL = {
  triangle_pct: '三角面占比', pole_count: '极点数', face_density_variance: '面密度方差',
  topostrain_score: 'TopoStrain', topostrain_risk_pct: '高风险顶点', watertight: '流形封闭',
  retry_count: '重试次数', mesh_count: '网格数', triangle_count: '三角面数',
  uv_triangle_count: '有UV面数', degenerate_uv_count: '退化UV', out_of_bounds_count: '越界UV',
  stretch_pct: 'UV拉伸率', utilization: 'UV利用率', utilization_first_quadrant: '第一象限利用率',
  resolution_match: '分辨率一致', normal_seam_ratio: '法线接缝率', normal_blue_mean: '法线蓝均值',
  ao_noise_level: 'AO噪声', skinned_mesh_count: '蒙皮网格', bone_count: '骨骼数',
  animation_clip_count: '动画数', material_count: '材质数', has_uv: '含UV',
  normal_map_imported: '法线已导入', resolutions: '烘焙分辨率',
};
const DIAG_LABEL = {
  total_vertices: '顶点数', total_faces: '面数', triangle_pct: '三角面占比',
  boundary_edges: '边界边', watertight: '流形封闭', non_manifold_edges: '非流形边',
  surface_area: '表面积', mean_face_density: '平均面密度', face_density_variance: '面密度方差',
  pole_count: '极点数',
};
function fmtVal(k, v) {
  if (typeof v === 'boolean') return v ? '是' : '否';
  if (v === null || v === undefined) return '—';
  if (typeof v === 'object') {
    const parts = [];
    for (const [kk, vv] of Object.entries(v)) {
      parts.push(Array.isArray(vv) ? vv.join('×') : `${kk}: ${vv}`);
    }
    return parts.join(' / ');
  }
  if (typeof v === 'number') {
    if (k.endsWith('_pct') || k.endsWith('_ratio')) return (v * 100).toFixed(1) + '%';
    if (k === 'normal_blue_mean') return v.toFixed(4);
    if (!Number.isInteger(v)) return v.toFixed(3);
    return v.toLocaleString();
  }
  return String(v);
}
const labelOf = (map, k) => map[k] || k;

/* ================= 工具状态 ================= */
async function loadTools() {
  try {
    const r = await fetch('/api/v1/tools');
    const t = await r.json();
    const items = [
      ['Blender', !!t.blender],
      ['Tuanjie', !!t.tuanjie],
      [t.uv_backend || 'UV', true],
      ['Meshy', t.meshy === 'ready'],
    ];
    $('#tools').innerHTML = items.map(([n, on]) =>
      `<span class="tool-badge ${on ? 'on' : ''}"><span class="dot"></span>${esc(n)}</span>`).join('');
  } catch (e) {
    $('#tools').innerHTML = '<span class="tool-badge"><span class="dot"></span>OFFLINE</span>';
  }
}
loadTools();

/* ================= 文件选择 ================= */
let pickedFile = null;
const dz = $('#dropzone'), fileInput = $('#file');
dz.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => setFile(fileInput.files[0]));
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('drag');
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
});
function setFile(f) {
  pickedFile = f;
  $('#fname').textContent = f ? f.name : '';
  $('#submitBtn').disabled = !f;
  $('#validateBtn').disabled = !f;
}

/* ================= 提交 / 质检 ================= */
$('#submitBtn').addEventListener('click', async () => {
  if (!pickedFile) return;
  const fd = new FormData();
  fd.append('file', pickedFile);
  fd.append('preset', $('#preset').value);
  fd.append('retopo_method', $('#retopo').value || '');
  fd.append('full', $('#full').checked);
  $('#submitBtn').disabled = true;
  try {
    const r = await fetch('/api/v1/tasks', { method: 'POST', body: fd });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const task = await r.json();
    toast('任务已提交 / ' + task.task_id.slice(0, 8));
    selectedId = task.task_id;
    await poll();
  } catch (e) { toast('提交失败：' + e.message); }
  $('#submitBtn').disabled = false;
});

$('#validateBtn').addEventListener('click', async () => {
  if (!pickedFile) return;
  const fd = new FormData(); fd.append('file', pickedFile);
  $('#validateBtn').disabled = true;
  $('#inspectCard').style.display = '';
  $('#inspectBody').innerHTML = '<div class="empty">正在诊断…</div>';
  try {
    const r = await fetch('/api/v1/validate', { method: 'POST', body: fd });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    renderInspect(data);
  } catch (e) {
    $('#inspectBody').innerHTML = `<div class="err-text">${esc(e.message)}</div>`;
  }
  $('#validateBtn').disabled = false;
});
function renderInspect(d) {
  const ga = (d.gate_a || d.report?.quality_reports?.gate_a_topology || {});
  const passed = d.status === 'passed' || ga.passed === true;
  const m = ga.metrics || d.metrics || {};
  let html = `<div class="banner ${passed ? 'ok' : 'warn'}">${passed ? 'Gate A 通过' : 'Gate A 未通过'}<span class="dur">${esc(d.status || '')}</span></div>`;
  const rows = Object.entries(m).map(([k, v]) =>
    `<div class="kv2"><b>${esc(labelOf(M_LABEL, k))}</b><span>${esc(fmtVal(k, v))}</span></div>`).join('');
  if (rows) html += `<div class="kv-grid">${rows}</div>`;
  $('#inspectBody').innerHTML = html;
}

/* ================= 任务列表轮询 ================= */
let selectedId = null;
let tasks = [];
let polling = true;

async function poll() {
  try {
    const r = await fetch('/api/v1/tasks?limit=50');
    const data = await r.json();
    tasks = data.tasks || [];
    render();
  } catch (e) { /* 静默，下轮重试 */ }
}
setInterval(() => { if (polling && !document.hidden) poll(); }, 2500);
poll();

function render() {
  const list = $('#tasklist');
  $('#count').textContent = tasks.length ? `${tasks.length} TASKS` : '';
  if (!tasks.length) {
    list.innerHTML = '<div class="empty">// 暂无任务，从左侧提交一个模型开始</div>';
    return;
  }
  list.innerHTML = tasks.map((t, i) => taskCardHTML(t, i + 1)).join('');
  list.querySelectorAll('.task-head').forEach(h => {
    h.addEventListener('click', () => {
      const id = h.dataset.id;
      const el = document.getElementById('task-' + id);
      const opening = !el.classList.contains('open');
      if (opening) loadDetail(id);
      el.classList.toggle('open', opening);
      document.querySelectorAll('.task').forEach(x => { if (x !== el) x.classList.remove('open', 'sel'); });
      el.classList.toggle('sel', opening);
    });
  });
  if (selectedId) {
    const el = document.getElementById('task-' + selectedId);
    if (el && !el.classList.contains('open')) {
      el.classList.add('open', 'sel');
      loadDetail(selectedId);
    }
  }
}

function taskCardHTML(t, idx) {
  const open = t.task_id === selectedId;
  const progress = t.status === 'passed' ? 100 : (t.progress || 0);
  const time = (t.created_at || '').replace('T', ' ').slice(5, 16);
  return `
  <div class="task ${open ? 'open sel' : ''}" id="task-${esc(t.task_id)}">
    <div class="task-head" data-id="${esc(t.task_id)}">
      <span class="arrow">▶</span>
      <span class="no">${String(idx).padStart(2, '0')}</span>
      <span class="fname">${esc(t.filename || '(未命名)')}</span>
      <span class="time">${esc(time)}</span>
      <span class="status ${esc(t.status)}">${esc(STATUS_ZH[t.status] || t.status)}</span>
    </div>
    ${t.status === 'running' || t.status === 'queued'
      ? `<div class="progress-wrap"><div class="progress-bar" style="width:${progress}%"></div></div>` : ''}
    <div class="task-body" id="body-${esc(t.task_id)}"></div>
  </div>`;
}

async function loadDetail(id) {
  const body = document.getElementById('body-' + id);
  if (!body) return;
  const t = tasks.find(x => x.task_id === id);
  if (!t) return;

  if (t.status === 'queued' || t.status === 'running') {
    body.innerHTML = `<div class="empty">管线运行中 / ${esc(t.stage || '')} / ${t.progress || 0}%</div>`;
    return;
  }

  body.innerHTML = '<div class="empty">加载报告…</div>';
  let report = null;
  try {
    const r = await fetch(`/api/v1/tasks/${id}/report`);
    if (r.ok) report = await r.json();
  } catch (e) {}

  const fin = ['passed', 'quality_failed', 'failed', 'cancelled', 'interrupted'].includes(t.status);
  if (!fin) { body.innerHTML = '<div class="empty">等待任务完成…</div>'; return; }

  let html = '';
  if (t.status === 'failed' || t.status === 'cancelled' || t.status === 'interrupted') {
    html += `<div class="banner bad">${esc(STATUS_ZH[t.status] || t.status)}${t.error ? '：' + esc(t.error) : ''}</div>`;
  } else {
    const ok = t.status === 'passed';
    const dur = report?.timeline?.total_duration_s;
    html += `<div class="banner ${ok ? 'ok' : 'warn'}">
      ${ok ? '四重质量门禁全部通过' : '质量未达标：' + esc(t.result?.failed_gate || '')}
      <span class="dur">${dur ? (typeof dur === 'number' ? dur.toFixed(2) : dur) + ' s' : ''}</span>
    </div>`;
  }

  if (report) {
    const q = report.quality_reports || {};
    html += '<div class="gates">';
    for (const [key, name] of GATES) {
      const g = q[key] || {};
      const cls = g.passed === true ? 'pass' : g.passed === false ? 'fail' : 'skip';
      const st = g.passed === true ? 'PASS' : g.passed === false ? 'FAIL' : 'SKIP';
      const pts = Object.entries(g.metrics || {}).slice(0, 6).map(([k, v]) =>
        `<div class="kv"><b>${esc(labelOf(M_LABEL, k))}</b><span>${esc(fmtVal(k, v))}</span></div>`).join('');
      html += `<div class="gate ${cls}">
        <div class="g-title"><span class="mark"></span>${esc(name)}<span class="g-state">${st}</span></div>
        <div class="g-pts">${pts || '<div class="kv"><b>—</b><span></span></div>'}</div>
      </div>`;
    }
    html += '</div>';

    const ts = q.gate_a_topology?.metrics?.topostrain_score;
    if (typeof ts === 'number') {
      const lv = ts < 40 ? 'good' : ts < 70 ? 'mid' : 'bad';
      html += `<div class="ts-row">
        <div class="ts-num ${lv}">${ts.toFixed(1)}</div>
        <div class="ts-desc"><b>TopoStrain 变形风险评分</b>（0–100，越低越健康）<br>
        绿 &lt; 40 · 金 40–70 · 红 &gt; 70 —— 红色顶点为骨骼变形高风险区域</div>
      </div>`;
    }

    const heat = q.gate_a_topology?.heatmap_path;
    if (heat) {
      html += `<div class="viewer-wrap">
        <div class="viewer-bar"><span class="tag">TOPOVISION</span>热力图 · 3D 查看<span class="hint">左键旋转 · 滚轮缩放 · 右键平移</span></div>
        <canvas id="viewer"></canvas>
      </div>`;
    }

    const files = report.output_files || [];
    const maps = files.filter(f => /\.(png|jpg)$/i.test(f));
    if (maps.length) {
      html += '<label class="fld" style="margin-top:16px;">烘焙贴图预览 / MAPS</label><div class="files-grid">';
      html += maps.map(f => {
        const url = `/api/v1/tasks/${id}/file?rel=${encodeURIComponent(f)}`;
        return `<div class="thumb"><a href="${url}" target="_blank"><img src="${url}" loading="lazy" /></a><div class="t">${esc(f.split('/').pop())}</div></div>`;
      }).join('');
      html += '</div>';
    }

    if (files.length) {
      html += '<label class="fld" style="margin-top:16px;">资产产物 / OUTPUT</label><div class="dl-list">';
      html += files.map(f => {
        const url = `/api/v1/tasks/${id}/file?rel=${encodeURIComponent(f)}`;
        return `<a href="${url}" download="${esc(f.split('/').pop())}">${esc(f.split('/').pop())}</a>`;
      }).join('');
      html += '</div>';
    }

    const diag = report.diagnosis || {};
    if (diag && Object.keys(diag).length) {
      const rows = Object.entries(DIAG_LABEL)
        .filter(([k]) => diag[k] !== undefined && typeof diag[k] !== 'object')
        .map(([k, l]) => `<div class="kv2"><b>${esc(l)}</b><span>${esc(fmtVal(k, diag[k]))}</span></div>`).join('');
      if (rows) html += `<label class="fld" style="margin-top:16px;">源网格诊断 / DIAGNOSIS</label><div class="kv-grid">${rows}</div>`;
    }
  }

  body.innerHTML = html;

  if (heat) initViewer(id, heat);
}

/* ================= three.js 热力图查看器 ================= */
let renderer = null, scene = null, camera = null, controls = null, modelGroup = null;
function initViewer(taskId, relPath) {
  const canvas = document.getElementById('viewer');
  if (!canvas) return;
  if (!renderer) {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0F0F0F);
    camera = new THREE.PerspectiveCamera(45, 2, 0.01, 1000);
    camera.position.set(3, 2.4, 4);
    controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    scene.add(new THREE.AmbientLight(0xffffff, 1.6));
    const dl = new THREE.DirectionalLight(0xffffff, 0.5);
    dl.position.set(5, 8, 6);
    scene.add(dl);
    const loop = () => {
      if (!renderer) return;
      requestAnimationFrame(loop);
      controls.update();
      renderer.render(scene, camera);
    };
    loop();
    new ResizeObserver(resize).observe(canvas.parentElement);
  }
  resize();

  fetch(`/api/v1/tasks/${taskId}/file?rel=${encodeURIComponent(relPath)}`)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(text => {
      const obj = new OBJLoader().parse(text);
      if (modelGroup) scene.remove(modelGroup);
      modelGroup = new THREE.Group();
      obj.traverse(o => {
        if (o.isMesh) {
          const hasColor = o.geometry.attributes.color;
          o.material = new THREE.MeshStandardMaterial({
            vertexColors: !!hasColor,
            color: hasColor ? 0xffffff : 0x8A8A93,
            roughness: 0.85, metalness: 0.05,
          });
          o.material.side = THREE.DoubleSide;
        }
      });
      const box = new THREE.Box3().setFromObject(obj);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const scale = 3 / maxDim;
      obj.position.set(-center.x * scale, -center.y * scale, -center.z * scale);
      obj.scale.setScalar(scale);
      modelGroup.add(obj);
      scene.add(modelGroup);
      camera.position.set(3, 2.4, 4);
      controls.target.set(0, 0, 0);
    })
    .catch(() => {
      const bar = canvas.parentElement.querySelector('.viewer-bar .hint');
      if (bar) bar.textContent = '热力图加载失败';
    });
}
function resize() {
  const canvas = document.getElementById('viewer');
  if (!canvas || !renderer) return;
  const w = canvas.parentElement.clientWidth;
  const h = 340;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

<script>
/* 标题逐字闪烁出场（移植自 grampixel.jp 的 splitCharReveal） */
(function () {
  var el = document.getElementById('heroTitle');
  if (!el) return;
  var text = el.textContent;
  el.textContent = '';
  el.classList.add('char-reveal');
  var FLICK = ['charFlickA', 'charFlickB', 'charFlickC'];
  Array.prototype.forEach.call(text, function (ch, idx) {
    var span = document.createElement('span');
    span.className = 'char' + (ch === ' ' ? ' space' : '');
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    var pat = FLICK[Math.floor(Math.random() * FLICK.length)];
    var dur = (0.18 + Math.random() * 0.20).toFixed(2);
    var delay = (0.25 + idx * 0.07 + Math.random() * 0.18).toFixed(3);
    span.style.animationName = pat;
    span.style.animationDuration = dur + 's';
    span.style.animationDelay = delay + 's';
    span.style.animationFillMode = 'forwards';
    el.appendChild(span);
  });
})();
</script>
