name: TopoFlow CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    env:
      # GitHub Windows runner 控制台为 cp1252，中文 print 会触发 UnicodeEncodeError；强制 UTF-8 模式
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -p "test_*.py"
      - run: python -m py_compile topoflow.py src/main.py src/pipeline/full_runner.py src/pipeline/stage10_engine_validate.py

